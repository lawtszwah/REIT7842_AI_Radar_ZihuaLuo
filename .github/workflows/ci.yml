name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Contract and protocol tests
        # The `validation` marker holds the prdsim validation gates. They are
        # written ahead of the simulator and are expected to fail until M2, so
        # they are deselected here rather than allowed to hide a real breakage
        # in a wall of red. Drop the filter once M2 is met.
        run: pytest -q -m "not validation"
      - name: Smoke benchmark must run end to end
        run: |
          prdbench run --config configs/protocol/smoke.yaml --out results/ci
          python scripts/make_figures.py --results results/ci/results.json --out results/ci/figures
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/ci
