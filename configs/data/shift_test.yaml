# Generalisation probe: parameter regimes deliberately outside the training grid.
# Answers research question 2 -- where do any gains actually occur?
#
# This file holds the authoritative joint-shift grid; it is NOT duplicated into
# configs/protocol/full.yaml, which defines the other reportable splits. Both files
# are covered by the protocol freeze. Referenced from README.md and
# docs/risk_register.md; see docs/simulator_model.md section 7.
simulator: groupgen
test:
  n_maps: 2000
  n_range: 99
  n_doppler: 81
  n_targets: [1, 1]
  # Effective SNR is about SNR_dB - DNR_dB + 50.5 dB (docs/data_grid.md), so this grid
  # sits at -4.5 to +10.5 dB effective: the lower half of the detection transition, under
  # a stronger direct path, stronger clutter and faster targets than any training map.
  snr_db: [-3.0, 8.0]
  extra:
    groupgen:
      csr_db: [30.0, 40.0]    # stronger clutter than training (20-30)
      dnr_db: [48.0, 52.0]    # stronger direct path than training (45)
      speed_kmh: [600.0, 850.0]  # faster than training (200-600): larger Doppler on average
