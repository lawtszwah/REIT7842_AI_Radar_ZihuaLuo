# Generalisation probe: parameter regimes deliberately outside the training grid.
# Answers research question 2 -- where do any gains actually occur?
#
# This file holds the authoritative joint-shift grid; it is NOT duplicated into
# configs/protocol/full.yaml, which defines the other reportable splits. Both files
# are covered by the protocol freeze. Referenced from README.md and
# docs/risk_register.md; see docs/simulator_model.md section 7.
simulator: groupgen
test:
  n_maps: 2000
  n_range: 99
  n_doppler: 81
  n_targets: [1, 1]
  snr_db: [-14.0, -4.0]       # weaker than most of training
  extra:
    groupgen:
      csr_db: [30.0, 40.0]    # stronger clutter than training
      dnr_db: [50.0, 55.0]    # stronger direct path than training
      speed_kmh: [600.0, 850.0]  # faster than training: larger Doppler on average
