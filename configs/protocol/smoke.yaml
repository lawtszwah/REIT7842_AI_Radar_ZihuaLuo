# Fast end-to-end run used in CI and for the design artefact screenshot.
# Small maps, few seeds -- proves the pipeline, not the science.
# Smoke results are never reportable.
simulator: stub

train:
  n_maps: 400
  n_range: 64
  n_doppler: 64
  snr_db: [2.0, 18.0]
  clutter_patches: [0, 3]

calibration:
  n_maps: 100
  n_range: 64
  n_doppler: 64
  n_targets: [0, 0]
  clutter_patches: [0, 3]

test_in_distribution:
  n_maps: 200
  n_range: 64
  n_doppler: 64
  snr_db: [0.0, 18.0]
  clutter_patches: [0, 3]

protocol:
  pfa_points: [1.0e-4, 1.0e-3, 1.0e-2]
  selection_pfa: 1.0e-3  # Rank configurations by validation Pd at this operating point.
  tol_bins: 1.0
  exclude_bins: 3.0
  zero_doppler_guard: 2
  snr_edges: [0, 4, 8, 12, 18]
  n_seeds: 2
  latency_repeats: 3
  min_eligible_background_cells: 100000
  quantile_method: higher
  threshold_comparison: score_gt_threshold
  bootstrap_interval_percentiles: [2.5, 97.5]  # 95% map-clustered percentile interval.
  seed_streams:
    - train_maps
    - test_in_distribution_maps
    - extended_test_maps
    - joint_shift_maps
    - validation_maps
    - calibration_maps
    - analysis_bootstrap
    - model_initialization
    - tuning_trial_selection

detectors:
  - {key: ca_cfar,   kind: ca_cfar,   params: {train: 4, guard: 2}}
  - {key: os_cfar,   kind: os_cfar,   params: {train: 4, guard: 2, rank_pct: 75}}
  - {key: go_cfar,   kind: go_cfar,   params: {train: 6, guard: 2}}
  - {key: feat_gbdt, kind: feat_gbdt, params: {max_iter: 80, max_depth: 6, neg_per_map: 300}}
  - {key: cnn,       kind: cnn,       params: {width: 16, depth: 4, epochs: 15}}
