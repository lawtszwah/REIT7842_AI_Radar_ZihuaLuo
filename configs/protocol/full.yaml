# The protocol the thesis results will be reported under.
# Frozen before the deep models are tuned; changes require an ADR.
simulator: prdsim         # the validated in-project simulator (M2); `stub` is not reportable
# Joint-shift grid lives in this repo-root-relative file and is covered by the freeze.
joint_shift_config: configs/data/shift_test.yaml

train:
  n_maps: 4000
  n_range: 128
  n_doppler: 128
  n_targets: [1, 3]
  snr_db: [0.0, 16.0]
  noise_power: [0.5, 2.0]
  clutter_patches: [0, 6]

# Disjoint model-selection split.
validation:
  n_maps: 1000
  n_range: 128
  n_doppler: 128
  n_targets: [1, 3]
  snr_db: [0.0, 16.0]
  noise_power: [0.5, 2.0]
  clutter_patches: [0, 6]

# Target-free null maps used only to set score thresholds after model selection.
# After masking, every run must retain at least 10^7 eligible background cells.
calibration:
  n_maps: 1000
  n_range: 128
  n_doppler: 128
  n_targets: [0, 0]
  noise_power: [0.5, 2.0]
  clutter_patches: [0, 6]

test_in_distribution:
  n_maps: 3000
  n_range: 128
  n_doppler: 128
  n_targets: [1, 3]
  snr_db: [0.0, 16.0]
  noise_power: [0.5, 2.0]
  clutter_patches: [0, 6]

# Extended test.
extended_test:
  n_maps: 3000
  n_range: 128
  n_doppler: 128
  n_targets: [1, 3]
  snr_db: [-4.0, 16.0]        # includes SNRs never seen in training
  noise_power: [0.25, 4.0]    # includes noise levels never seen in training
  clutter_patches: [0, 10]

protocol:
  pfa_points: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
  selection_pfa: 1.0e-3  # Rank configurations by validation Pd at this operating point.
  tol_bins: 1.0
  exclude_bins: 3.0
  zero_doppler_guard: 2
  snr_edges: [-4, 0, 4, 8, 12, 16]
  n_seeds: 5
  latency_repeats: 10
  min_eligible_background_cells: 10000000
  calibration_method: empirical_background_quantile
  quantile_method: higher
  threshold_comparison: score_gt_threshold
  bootstrap_resamples: 10000
  bootstrap_interval_percentiles: [2.5, 97.5]  # 95% map-clustered percentile interval.

  # Child streams spawned from each run's root seed, in this exact order:
  #   children = numpy.random.SeedSequence(root_seed).spawn(len(seed_streams))
  # The stream for a name is the child at its index in this list. Integer offsets
  # from the root seed were rejected: with offsets of 1000 and root seeds spaced
  # 1000 apart, one run's test stream equals another run's training stream.
  #
  # THE ORDER IS FROZEN WITH THE PROTOCOL. Appending a name at the end is safe;
  # inserting, removing or reordering changes the seeds of every later stream and
  # invalidates every run made under the previous order.
  seed_streams:
    - train_maps
    - test_in_distribution_maps
    - extended_test_maps
    - joint_shift_maps        # grid itself lives in configs/data/shift_test.yaml
    - validation_maps
    - calibration_maps
    - analysis_bootstrap
    - model_initialization
    - tuning_trial_selection

  # Gate 3 uses a 99% interval at four design points, so a correct simulator fails
  # a run about 4% of the time. One repeat is permitted, at the next seed, and only
  # when the failure is confined to a single design point. See simulator_model.md
  # section 8.
  gate3_permitted_repeats: 1

# Seeds and numerical settings for the analytical simulator-validation run.
# These are deliberately separate from `protocol.seed_streams`: the validation
# run is evidence about the simulator, not one of the benchmark data splits.
# The second root is consumed only when Gate 3's first run fails at exactly one
# design point. Reordering stream names changes every derived seed and therefore
# requires a new simulator-validation record.
simulator_validation:
  root_seeds: [20261031, 20261032]
  seed_streams:
    - contract
    - component_switches
    - gate1_noise
    - gate2_targets
    - gate3_noise
    - analysis_bootstrap
  acceptance_z: 4.0
  map_size: 128
  gate1:
    noise_powers: [0.25, 1.0, 4.0, 8.0]
    n_maps: 64
    quantiles: [0.5, 0.9, 0.99, 0.999]
  gate2:
    offsets: [0.0, 0.125, 0.25, 0.375, 0.5]
    n_maps: 4096
    chunk_size: 512
    snr_db: 10.0
    noise_power: 1.0
    metadata_tolerance_db: 1.0e-5
  gate3:
    train: 4
    guard: 2
    chunk_size: 124
    noise_power: 1.0
    min_eligible_cells: 10000000
    bootstrap_resamples: 10000
    interval_percentiles: [0.5, 99.5]

detectors:
  - {key: ca_cfar,   kind: ca_cfar}
  - {key: os_cfar,   kind: os_cfar}
  - {key: go_cfar,   kind: go_cfar}
  - {key: feat_gbdt, kind: feat_gbdt}
  - {key: cnn,       kind: cnn}
  - {key: attention, kind: attention}    # M3

search_spaces:
  ca_cfar:   {train: [2, 4, 6, 8, 12], guard: [1, 2, 3, 4]}
  os_cfar:   {train: [4, 6, 8], guard: [1, 2, 3], rank_pct: [50, 62.5, 75, 87.5]}
  go_cfar:   {train: [2, 4, 6, 8, 12], guard: [1, 2, 3, 4]}
  feat_gbdt: {max_iter: [80, 160, 320], learning_rate: [0.05, 0.1, 0.2], max_depth: [4, 6, 8]}
  cnn:       {width: [8, 16, 32], depth: [3, 4, 6], lr: [1.0e-3, 3.0e-3]}
