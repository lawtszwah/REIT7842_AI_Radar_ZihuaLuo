[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prdbench"
version = "0.1.0"
description = "Benchmarking machine learning models against CFAR baselines for target detection in passive radar"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
# ruff is pinned: an unpinned linter means CI can turn red with no code change,
# because a new release adds rules. Bump this deliberately, in its own commit.
dev = ["pytest>=7.4", "ruff==0.16.5"]

[project.scripts]
prdbench = "prdbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errors, pyflakes, import order, pyupgrade and bugbear. Deliberately not the
# broader stylistic rule sets: a linter that argues about taste gets ignored,
# and the checks that matter here are correctness and determinism.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The diagram scripts hold long prose strings that are the diagram copy;
# wrapping them would make the source harder to edit, not easier.
"scripts/make_diagrams.py" = ["E501"]
